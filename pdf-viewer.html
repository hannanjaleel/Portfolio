<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Work | Hannan Jaleel K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --black:#050505;
    --black2:#0b0b0b;
    --gold:#c6a15b;
    --gold-light:#e3ca92;
    --gold-dark:#806536;
    --cream:#f5f0e6;
    --muted:#858078;
    --line:rgba(198,161,91,.22);
    --soft:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--black);color:var(--cream);font-family:"Inter",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}
.viewer-header{
    flex:0 0 auto;min-height:78px;padding:0 5vw;display:flex;align-items:center;
    justify-content:space-between;gap:24px;background:rgba(5,5,5,.9);border-bottom:1px solid var(--soft);
    position:relative;z-index:2;
}
.logo{font-family:"Playfair Display",serif;font-size:1.4rem;letter-spacing:.05em;color:var(--cream)}
.logo span{color:var(--gold)}
.viewer-title{color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.back-button,.open-button{
    display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;
    border:1px solid var(--line);color:var(--cream);font-size:.68rem;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:.3s ease;white-space:nowrap;
}
.back-button:hover,.open-button:hover{border-color:var(--gold);color:var(--gold-light);background:rgba(198,161,91,.08);transform:translateY(-2px)}
.viewer-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 5vw 28px;position:relative;z-index:1}
.viewer-info{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
.viewer-info h1{font-family:"Playfair Display",serif;color:var(--cream);font-size:clamp(1.6rem,3vw,2.6rem);font-weight:500}
.viewer-info h1 em{color:var(--gold);font-style:italic}
.pdf-shell{flex:1;min-height:0;border:1px solid var(--line);background:var(--black2);box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden}
#pdf-frame{display:block;width:100%;height:100%;min-height:calc(100vh - 165px);border:0;background:#fff}
.error{display:none;height:100%;min-height:300px;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:30px;color:var(--muted)}
.error strong{color:var(--cream);font-family:"Playfair Display",serif;font-size:1.5rem;font-weight:500}
@media(max-width:650px){
    body{overflow:auto}.viewer-header{min-height:70px;padding:0 6vw}.viewer-title{display:none}
    .viewer-main{padding:20px 4vw}.viewer-info{align-items:flex-start;flex-direction:column}.open-button{align-self:flex-start}
    .pdf-shell{min-height:calc(100vh - 190px)}#pdf-frame{min-height:calc(100vh - 190px)}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="viewer-header">
    <a href="index.html" class="logo">Hannan<span>.</span></a>
    <div class="viewer-title">Selected Work · PDF Viewer</div>
    <a href="index.html" class="back-button">← Back to Portfolio</a>
</header>

<main class="viewer-main">
    <div class="viewer-info">
        <h1 id="pdf-title">Selected <em>Work</em></h1>
        <a id="open-pdf" class="open-button" href="#" target="_blank" rel="noopener noreferrer">Open PDF ↗</a>
    </div>
    <div class="pdf-shell">
        <iframe id="pdf-frame" title="Portfolio PDF"></iframe>
        <div id="pdf-error" class="error">
            <strong>PDF unavailable</strong>
            <span>The requested work sample could not be found.</span>
            <a href="index.html" class="back-button">← Back to Portfolio</a>
        </div>
    </div>
</main>

<script>
const files = {
    content: {
        title: "Content <em>Writing</em>",
        file: "Talrop/News Paper content .pdf"
    },
    script: {
        title: "Script <em>Writing</em>",
        file: "Talrop/Reel Script .pdf"
    },
    marketing: {
        title: "Digital <em>Marketing</em>",
        file: "Talrop/Digital marketing campaigns script .pdf"
    },
    multimedia: {
        title: "Multimedia <em>Projects</em>",
        file: "Talrop/Talrop@Trivandrum District-Vlog.pdf"
    }
};

const key = new URLSearchParams(window.location.search).get("file");
const selected = files[key];
const frame = document.getElementById("pdf-frame");
const openPdf = document.getElementById("open-pdf");
const title = document.getElementById("pdf-title");
const error = document.getElementById("pdf-error");

if (selected) {
    const pdfUrl = encodeURI(selected.file);
    title.innerHTML = selected.title;
    frame.src = pdfUrl;
    openPdf.href = pdfUrl;
    frame.addEventListener("error", () => {
        frame.style.display = "none";
        error.style.display = "flex";
    });
} else {
    frame.style.display = "none";
    openPdf.style.display = "none";
    error.style.display = "flex";
}
</script>
</body>
</html>
